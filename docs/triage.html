<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Blossom triage</title>
<style>
  body { font-family: -apple-system, Helvetica, Arial, sans-serif; max-width: 560px; margin: 60px auto; padding: 0 20px; color: #222; line-height: 1.5; }
  a.btn { display: inline-block; background: #5b8a6b; color: #fff; text-decoration: none; font-weight: 600; padding: 12px 22px; border-radius: 10px; }
  pre { white-space: pre-wrap; background: #f4f4f4; padding: 12px; border-radius: 8px; font-size: 12px; }
  .muted { color: #666; font-size: 14px; }
</style>
</head>
<body>
<h2>Blossom triage</h2>
<p id="status" class="muted">Opening Claude Code…</p>
<p><a id="open" class="btn" href="#">Open in Claude Code</a></p>
<p class="muted">If nothing happens, copy this into Claude Code in ~/workspace/habit-tracker:</p>
<pre id="prompt"></pre>
<script>
  (function () {
    var d = new URLSearchParams(location.search).get("d") || "";
    var status = document.getElementById("status");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) {
      status.textContent = "Missing or invalid date in the link.";
      document.getElementById("open").style.display = "none";
      return;
    }
    var prompt =
      "Blossom weekly triage. Run `git fetch origin && git checkout claude/triage-" + d + "` and read docs/triage/" + d + ".md. " +
      "Implement ONLY these items: ___ (Frances: fill in the numbers before pressing Enter). " +
      "Follow CLAUDE.md. Make one commit per item, and run the simulator build from CLAUDE.md until it ends with ** BUILD SUCCEEDED **, fixing any errors. Then push the branch. " +
      "If Notion and Gmail tools are available here, also add one terse bullet per change to the In progress release page in the Notion 'Blossom Habit Tracker' database, " +
      "and create Gmail draft replies (drafts only, never send) as described in the plan file's 'Reply drafts' section. " +
      "If they're not available, tell me, and I'll finish those steps from the cloud session.";
    var url = "claude://code/new?folder=" + encodeURIComponent("/Users/fling/workspace/habit-tracker") +
              "&q=" + encodeURIComponent(prompt);
    document.getElementById("prompt").textContent = prompt;
    document.getElementById("open").href = url;
    document.title = "Blossom triage " + d;
    location.href = url;
    setTimeout(function () { status.textContent = "Week of " + d + ". Click the button if Claude Code didn't open."; }, 1500);
  })();
</script>
</body>
</html>
